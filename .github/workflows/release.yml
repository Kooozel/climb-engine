# A release here is a tag, not a store submission — `npm i
# github:Kooozel/climb-engine#v0.1.0` is the whole distribution channel. What
# this adds on top is the three assets, because the point of choosing tags over
# a registry is that ~/sport and krpaly each want exactly one file: a release
# asset makes vendoring a curl against an immutable URL instead of a
# clone-and-copy, and the generated VERSION means the provenance fields stop
# being hand-typed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # First, and before anything is built or published: a tag that disagrees
      # with package.json is a release nobody can install by the version they
      # think they are installing, and a tag cannot be moved once consumers
      # have it.
      - name: Tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match package.json ($PKG)"
            exit 1
          fi
          echo "Tag OK — $GITHUB_REF_NAME matches package.json"

      - run: npm ci

      # The tag's commit passed CI on its pull request, but a tag can be pushed
      # at any commit, and these assets are what three consumers vendor. The
      # whole gate costs a minute.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run build
      - run: node scripts/check-no-node-imports.mjs

      # Freshness only — no BASE_REF. Whether this version was allowed to move
      # the output was settled on the pull request; what matters here is that
      # the digests shipped with the tag describe the build being shipped.
      - run: node scripts/check-fixture-hash.mjs

      - run: node scripts/write-version.mjs

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/climb-engine.mjs
            dist/climb-cli.mjs
            dist/VERSION
